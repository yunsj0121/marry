[project]
name = "marry"
version = "0.2.0"
description = "Samsung Card wedding hall application and availability monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45.0",
]

[project.scripts]
marry-apply = "marry.apply:main"
marry-monitor = "marry.monitor:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
