name: Build CI image
# Chromium/tesseract를 미리 구워넣은 이미지를 만들어서, 모니터/리허설 워크플로우가
# 매번 apt로 설치하지 않도록 한다. Dockerfile이 바뀔 때 자동 빌드하고, 필요하면
# 수동으로도 다시 빌드할 수 있다.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/marry-ci:latest
