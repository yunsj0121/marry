name: Wedding seat monitor
# Application-button diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wedding-seat-monitor.yml"
  schedule:
    - cron: "7,37 7-22 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      extra_targets:
        description: "임시로 한 번만 확인할 타깃 (예: 2027-08-29 11:00,2027-08-29 13:00)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wedding-seat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SAMSUNG_WEDDING_EMPLOYEE_ID: ${{ secrets.SAMSUNG_WEDDING_EMPLOYEE_ID }}
      SAMSUNG_WEDDING_EMPLOYEE_PASSWORD: ${{ secrets.SAMSUNG_WEDDING_EMPLOYEE_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EXTRA_TARGETS: ${{ github.event.inputs.extra_targets }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ensure OCR engine
        timeout-minutes: 2
        continue-on-error: true
        run: command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
      - name: Install project
        run: pip install -e . pytest
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: pytest -q
      - name: Check availability
        run: marry-monitor
      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wedding-monitor-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save monitor state
        if: always()
        run: |
          if git diff --quiet -- state/availability.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/availability.json
          git commit -m "Update wedding monitor state"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git merge -X ours --no-edit origin/main
          done
          exit 1
