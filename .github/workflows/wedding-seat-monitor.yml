name: Wedding seat monitor
# Application-button diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wedding-seat-monitor.yml"
  schedule:
    - cron: "7,37 7-22 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      extra_targets:
        description: "임시로 한 번만 확인할 타깃 (예: 2027-08-29 11:00,2027-08-29 13:00)"
        required: false
        default: ""

permissions:
  contents: write
  packages: read

concurrency:
  group: wedding-seat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yunsj0121/marry-ci:latest
    timeout-minutes: 15
    env:
      SAMSUNG_WEDDING_EMPLOYEE_ID: ${{ secrets.SAMSUNG_WEDDING_EMPLOYEE_ID }}
      SAMSUNG_WEDDING_EMPLOYEE_PASSWORD: ${{ secrets.SAMSUNG_WEDDING_EMPLOYEE_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EXTRA_TARGETS: ${{ github.event.inputs.extra_targets }}

    steps:
      - uses: actions/checkout@v4
      # ghcr.io/yunsj0121/marry-ci 이미지에 이미 Python(+Chromium, tesseract)이
      # 들어있어서 actions/setup-python은 쓰지 않는다 - 컨테이너 안에서 setup-python이
      # 자체 Python을 새로 받으려다 pip 실행 파일을 못 찾아 실패하는 걸 확인했음
      # (spawn pip ENOENT). 이미지에 내장된 python3를 그대로 쓴다.
      - name: Install project
        run: python3 -m pip install -e . pytest
      # 버전이 맞으면 거의 즉시 끝나는 안전망 - 이미지가 오래돼 playwright 패키지
      # 버전과 어긋나는 경우에만 실제로 다운로드가 발생한다.
      - name: Install Chromium
        run: python3 -m playwright install --with-deps chromium
      - name: Run tests
        run: python3 -m pytest -q
      - name: Check availability
        run: marry-monitor
      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wedding-monitor-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save monitor state
        if: always()
        run: |
          if git diff --quiet -- state/availability.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/availability.json
          git commit -m "Update wedding monitor state"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git merge -X ours --no-edit origin/main
          done
          exit 1
